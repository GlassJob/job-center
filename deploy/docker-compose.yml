# GlassJob 开发环境 Docker Compose（nginx 单入口；无域名/TLS 时用 http/ws）
# 注意：当前开发盒子无 Docker 守护进程，Compose 文件按各仓最新独立构建规范对齐。
# 用法：cd deploy && cp .env.example .env && 修改密码与密钥 && docker compose up -d --build
name: glassjob

x-tz: &tz
  TZ: ${TZ:-Asia/Shanghai}   # 默认调度时区 = Job Center 服务器本地时区，容器必须设置 TZ

services:
  mysql:
    image: mysql:8.0
    environment:
      <<: *tz
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      GJ_CENTER_PASSWORD: ${GJ_CENTER_PASSWORD:?set in .env}
      GJ_ADMIN_PASSWORD: ${GJ_ADMIN_PASSWORD:?set in .env}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30

  job-center:
    build: ..
    image: glassjob/job-center:dev
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      <<: *tz
      JC_DB_DSN: "job_center:${GJ_CENTER_PASSWORD}@tcp(mysql:3306)/job_center?parseTime=true&loc=UTC"
      JC_CREDENTIAL_PEPPER: ${JC_CREDENTIAL_PEPPER:?set in .env}
      JC_ADMIN_CLIENT_SECRETS: "glassadmin:${JC_ADMIN_CLIENT_SECRET:?set in .env},deployer:${JC_DEPLOYER_SECRET:?set in .env}"
      JC_HTTP_EXECUTOR_ADDR: ":8080"
      JC_HTTP_ADMIN_ADDR: ":8081"
      JC_ARCHIVE_DIR: /var/lib/glassjob/archive
    volumes:
      - archive:/var/lib/glassjob/archive
    expose: ["8080", "8081"]

  glassadmin:
    build: ../../job-admin   # 需与 job-center 同级检出独立完整的 GlassJob/job-admin 仓库
    image: glassjob/job-admin:dev
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      <<: *tz
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: job_admin
      DB_USER: job_admin
      DB_PASS: ${GJ_ADMIN_PASSWORD}
      DB_CHARSET: utf8mb4
      DB_PREFIX: ga_
      JC_ADMIN_BASE_URL: http://job-center:8081
      JC_ADMIN_CLIENT_ID: glassadmin
      JC_ADMIN_CLIENT_SECRET: ${JC_ADMIN_CLIENT_SECRET:?set in .env}
      JC_ADMIN_SSE_PUBLIC_BASE: /jc/sse
      JC_ADMIN_TIMEOUT: "10"
    expose: ["9000"]
    volumes:
      - admin-dist:/app/web/dist

  nginx:
    image: nginx:1.27-alpine
    environment: *tz
    depends_on: [job-center, glassadmin]
    ports: ["${HTTP_PORT:-80}:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - admin-dist:/usr/share/nginx/html:ro

volumes:
  mysql-data:
  archive:
  admin-dist:
