# nginx 单入口（开发环境 http/ws；上 TLS 时增加 listen 443 ssl 并把 Executor 地址改为 wss://）
# 未验证（盒子无 Docker），P8 验证。
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # GlassAdmin 前端
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }

    # GlassAdmin 后端（ThinkPHP 8, PHP-FPM）
    location /backend/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass glassadmin:9000;
    }

    # Executor WebSocket（只放行升级请求）
    location = /v1/executor/ws {
        proxy_pass http://job-center:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SSE：只放行 GET /v1/admin/executions/{id}/events?ticket=
    location ~ ^/jc/sse/v1/admin/executions/([0-9A-HJKMNP-TV-Z]{26})/events$ {
        limit_except GET { deny all; }
        proxy_pass http://job-center:8081/v1/admin/executions/$1/events$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # 其余 Job Center 管理 API 不对浏览器开放
    location /v1/ { return 404; }
}
