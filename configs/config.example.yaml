node_id: jc-1

http:
  addr: ":8080"

database:
  # 示例：job_center:PASSWORD@tcp(127.0.0.1:3306)/job_center?parseTime=true&loc=UTC
  dsn: ""
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h

security:
  # 必填：用于 secret 哈希与 AES 加密
  credential_pepper: "change-me-to-a-long-random-string"
  timestamp_skew_seconds: 300
  # 仅当 clients 表为空时生效；明文 secret 只打印一次
  bootstrap_client_secret: ""
  bootstrap_client_name: bootstrap

websocket:
  auth_timeout: 10s
  ping_interval: 20s
  ping_timeout: 60s
  write_timeout: 10s
  max_message_bytes: 1048576
  send_queue_size: 64
  heartbeat_interval: 10s
  lease_ttl: 30s

scheduler:
  enabled: true
  generate_interval: 24h
  claim_lead: 1s       # 提前醒（早到上班）；有 PENDING 时睡到 fire_at-lead
  # 无 PENDING 时 Claim 只等 WakeClaim（Generate/排班变更），不再定时扫库
  claim_max_idle: 5s   # 已废弃（兼容保留）
  claim_interval: 5s   # 兼容旧字段
  queue_interval: 2s
  horizon: 168h # 7d；新建/改 cron 会立刻预生成
  claim_batch: 50
  queue_batch: 50
  claim_ttl: 30s

log:
  level: info
  format: json
